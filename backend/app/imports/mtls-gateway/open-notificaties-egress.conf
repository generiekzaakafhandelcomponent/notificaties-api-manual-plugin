# Egress proxy of Open Notificaties: Open Notificaties can't present a client certificate itself, so its delivery
# worker sends notificaties to http://localhost:8446 (this proxy, in the worker's network namespace), which forwards
# them to the mTLS gateway with the client certificate of Open Notificaties. At a municipality, an outgoing gateway or
# service mesh does this.

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # resolve the gateway per request, so the proxy starts even before the gateway does
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 127.0.0.1:8446;

        location / {
            set $gateway                  https://mtls-gateway:8446;
            proxy_pass                    $gateway;
            proxy_set_header Host         localhost:8446;
            proxy_ssl_certificate         /etc/nginx/certs/open-notificaties.pem;
            proxy_ssl_certificate_key     /etc/nginx/certs/open-notificaties-key.pem;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
            proxy_ssl_verify              on;
            proxy_ssl_name                mtls-gateway;
            proxy_ssl_server_name         on;
        }
    }
}
