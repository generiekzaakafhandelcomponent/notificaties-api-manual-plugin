<cds-inline-notification
  [attr.data-test-id]="testIds.order"
  [notificationObj]="{
    type: 'info',
    title: ('orderTitle' | pluginTranslate: pluginId | async),
    message: ('orderMessage' | pluginTranslate: pluginId | async),
    showClose: false,
    lowContrast: true,
  }"
></cds-inline-notification>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
  } as obs"
>
  <v-input
    name="configurationTitle"
    [attr.data-test-id]="testIds.configurationTitle"
    [title]="'configurationTitle' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.configurationTitle"
    [required]="true"
    [trim]="true"
    [tooltip]="'configurationTitleTooltip' | pluginTranslate: pluginId | async"
    placeholder="Open Notificaties via gateway"
  >
  </v-input>
  <v-input
    name="url"
    [attr.data-test-id]="testIds.url"
    [title]="'url' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.url"
    [required]="true"
    [trim]="true"
    [tooltip]="'urlTooltip' | pluginTranslate: pluginId | async"
    placeholder="https://opennotificaties.example.com/api/v1/"
  >
  </v-input>
</v-form>

<valtimo-notificaties-api-manual-plugin-manual-abonnement
  [manualAbonnement]="manualAbonnement$ | async"
  [pluginId]="pluginId"
></valtimo-notificaties-api-manual-plugin-manual-abonnement>
