# Minimum supported Valtimo version. The published jar is compiled against it, so it runs on every later 13.x.
# Don't bump it to the latest: CI also tests against the latest (see .github/workflows/pr-checks.yaml).
valtimoVersion=13.41.0.RELEASE
# Valtimo version of the sandbox application (backend/app): the Http Client Authentication plugin it uses for the mTLS
# gateway needs 13.48 or later.
sandboxValtimoVersion=13.51.0.RELEASE
